
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanskriti-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sanskriti-styles
  template:
    metadata:
      labels:
        app: sanskriti-styles
    spec:
      containers:
        - name: sanskriti-container
          image: sanskriti-styles:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
